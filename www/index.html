<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e3a8a">
<title>X O - تيك تاك تو</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  h1 { font-size: 2.2rem; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .status { font-size: 1.2rem; margin-bottom: 20px; min-height: 1.5em; font-weight: 600; }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: min(90vw, 360px);
    aspect-ratio: 1;
  }
  .cell {
    background: rgba(255,255,255,.15);
    border: 2px solid rgba(255,255,255,.4);
    border-radius: 12px;
    font-size: 3rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: background .15s, transform .1s;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  .cell:hover { background: rgba(255,255,255,.25); }
  .cell:active { transform: scale(.95); }
  .cell.x { color: #fbbf24; }
  .cell.o { color: #34d399; }
  .cell.win { background: rgba(255,255,255,.4); animation: winPulse .6s ease 2; }
  @keyframes winPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
  .cell.pop { animation: pop .3s ease; }
  @keyframes pop { 0%{transform:scale(.5)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .board.shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .controls { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button {
    background: #fff; color: #1e3a8a; border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 1rem; font-weight: 600; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  button:active { transform: scale(.97); }
  .score { margin-top: 16px; font-size: 1rem; opacity: .9; }
  .mode { margin-bottom: 12px; }
  #difficulty { display: none; margin-bottom: 12px; }
  select { padding: 6px 10px; border-radius: 6px; border: none; font-size: 1rem; }
</style>
</head>
<body>
  <h1>❌⭕ تيك تاك تو</h1>
  <div class="mode">
    <label for="mode">الوضع: </label>
    <select id="mode">
      <option value="pvp">لاعب ضد لاعب</option>
      <option value="ai">لاعب ضد الكمبيوتر</option>
    </select>
  </div>
  <div id="difficulty">
    <label for="difficulty">الصعوبة: </label>
    <select id="difficulty">
      <option value="easy">سهل (عشوائي)</option>
      <option value="medium">متوسط (نصف ذكي)</option>
      <option value="hard">صعب (مستحيل)</option>
    </select>
  </div>
  <div class="status" id="status">دور X</div>
  <div class="board" id="board"></div>
  <div class="score" id="score">X: 0  |  O: 0  |  تعادل: 0</div>
  <div class="controls">
    <button id="reset"> إلعب جولة جديدة</button>
    <button id="resetAll">مسح النتائج</button>
  </div>

<script>
// Web Audio API sounds (no external files)
let audioCtx = null;
function getAudioCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function playTone(freq, dur, type='sine', vol=0.15){
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(e){}
}
function soundClick(){ playTone(440, 0.08, 'square', 0.1); }
function soundWin(){ playTone(523,0.12,'sine',0.18); setTimeout(()=>playTone(659,0.12,'sine',0.18),120); setTimeout(()=>playTone(784,0.18,'sine',0.18),240); }
function soundDraw(){ playTone(300,0.2,'triangle',0.15); setTimeout(()=>playTone(250,0.2,'triangle',0.15),200); }
function soundAi(){ playTone(330,0.1,'sine',0.1); }
function confettiBurst(){
  const colors = ['#fbbf24','#34d399','#60a5fa','#f472b6','#a78bfa'];
  for(let k=0;k<40;k++){
    const el = document.createElement('div');
    el.className='confetti';
    el.style.left = (window.innerWidth/2 + (Math.random()-0.5)*200)+'px';
    el.style.top = (window.innerHeight/2)+'px';
    el.style.width = (6+Math.random()*6)+'px';
    el.style.height = el.style.width;
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.borderRadius = Math.random()>.5?'50%':'2px';
    document.body.appendChild(el);
    const dx = (Math.random()-0.5)*400;
    const dy = -100 - Math.random()*300;
    el.animate([
      {transform:'translate(0,0)', opacity:1},
      {transform:`translate(${dx}px,${dy+400}px) rotate(${Math.random()*720}deg)`, opacity:0}
    ], {duration:1200+Math.random()*600, easing:'cubic-bezier(.2,.8,.2,1)'});
    setTimeout(()=>el.remove(), 1800);
  }
}
const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const scoreEl = document.getElementById('score');
const modeSel = document.getElementById('mode');
const difficultySel = document.getElementById('difficulty');
let board = Array(9).fill(null);
let current = 'X';
let gameOver = false;
let scores = { X:0, O:0, D:0 };
let difficulty = 'hard';

function updateDifficultyVisibility(){
  difficultySel.parentElement.style.display = (modeSel.value === 'ai') ? 'block' : 'none';
}

const wins = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

function render() {
  boardEl.innerHTML = '';
  board.forEach((v,i) => {
    const c = document.createElement('div');
    c.className = 'cell' + (v ? ' '+v.toLowerCase() : '');
    c.textContent = v || '';
    c.addEventListener('click', () => move(i));
    boardEl.appendChild(c);
  });
}

function checkWinner(b) {
  for (const [a,bb,cc] of wins) {
    if (b[a] && b[a]===b[bb] && b[a]===b[cc]) return {player:b[a], line:[a,bb,cc]};
  }
  if (b.every(x=>x)) return {player:'D', line:[]};
  return null;
}

function move(i) {
  if (gameOver || board[i]) return;
  board[i] = current;
  soundClick();
  // pop animation on the cell
  const cells = boardEl.querySelectorAll('.cell');
  cells[i].classList.add('pop');
  setTimeout(()=>cells[i].classList.remove('pop'), 300);
  const res = checkWinner(board);
  if (res) {
    gameOver = true;
    if (res.player === 'D') { statusEl.textContent = 'تعادل!'; scores.D++; soundDraw(); boardEl.classList.add('shake'); setTimeout(()=>boardEl.classList.remove('shake'),400); }
    else { statusEl.textContent = 'فاز '+res.player+'!'; scores[res.player]++; highlight(res.line); soundWin(); confettiBurst(); }
    updateScore();
    return;
  }
  current = current === 'X' ? 'O' : 'X';
  statusEl.textContent = 'دور '+current;
  render();
  if (modeSel.value === 'ai' && current === 'O' && !gameOver) {
    setTimeout(()=>{ soundAi(); aiMove(); }, 350);
  }
}

function highlight(line) {
  render();
  line.forEach(i => {
    const cells = boardEl.querySelectorAll('.cell');
    cells[i].classList.add('win');
  });
}

function aiMove() {
  if (gameOver) return;

  if (difficulty === 'easy') {
    // Easy: completely random move
    const empties = [];
    for (let i=0;i<9;i++) if (!board[i]) empties.push(i);
    if (empties.length) move(empties[Math.floor(Math.random()*empties.length)]);
    return;
  }

  if (difficulty === 'medium') {
    // Medium: 50% random, 50% smart
    const empties = [];
    for (let i=0;i<9;i++) if (!board[i]) empties.push(i);
    if (empties.length) {
      if (Math.random() < 0.5) {
        move(empties[Math.floor(Math.random()*empties.length)]);
        return;
      }
    }
  }

  // Hard: Minimax (perfect play)
  let best = -Infinity, idx = -1;
  for (let i=0;i<9;i++){
    if (!board[i]){
      board[i]='O';
      const s = minimax(board, 0, false);
      board[i]=null;
      if (s > best){ best=s; idx=i; }
    }
  }
  if (idx !== -1) move(idx);
}

function minimax(b, depth, isMax) {
  const r = checkWinner(b);
  if (r) {
    if (r.player === 'O') return 10 - depth;
    if (r.player === 'X') return depth - 10;
    return 0;
  }
  if (isMax) {
    let best = -Infinity;
    for (let i=0;i<9;i++) if(!b[i]){ b[i]='O'; best=Math.max(best,minimax(b,depth+1,false)); b[i]=null; }
    return best;
  } else {
    let best = Infinity;
    for (let i=0;i<9;i++) if(!b[i]){ b[i]='X'; best=Math.min(best,minimax(b,depth+1,true)); b[i]=null; }
    return best;
  }
}

function updateScore() {
  scoreEl.textContent = `X: ${scores.X}  |  O: ${scores.O}  |  تعادل: ${scores.D}`;
}

document.getElementById('reset').addEventListener('click', () => {
  board = Array(9).fill(null);
  current = 'X';
  gameOver = false;
  statusEl.textContent = 'دور X';
  render();
});

document.getElementById('resetAll').addEventListener('click', () => {
  scores = {X:0,O:0,D:0};
  updateScore();
  document.getElementById('reset').click();
});

modeSel.addEventListener('change', updateDifficultyVisibility);
updateDifficultyVisibility();

render();
</script>
</body>
</html>
