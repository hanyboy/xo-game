<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e3a8a">
<title>X O - تيك تاك تو</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  h1 { font-size: 2.2rem; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .status { font-size: 1.2rem; margin-bottom: 20px; min-height: 1.5em; font-weight: 600; }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: min(90vw, 360px);
    aspect-ratio: 1;
  }
  .cell {
    background: rgba(255,255,255,.15);
    border: 2px solid rgba(255,255,255,.4);
    border-radius: 12px;
    font-size: 3rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: background .15s, transform .1s;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  .cell:hover { background: rgba(255,255,255,.25); }
  .cell:active { transform: scale(.95); }
  .cell.x { color: #fbbf24; }
  .cell.o { color: #34d399; }
  .cell.win { background: rgba(255,255,255,.4); animation: pulse .6s ease 2; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  .controls { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button {
    background: #fff; color: #1e3a8a; border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 1rem; font-weight: 600; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  button:active { transform: scale(.97); }
  .score { margin-top: 16px; font-size: 1rem; opacity: .9; }
  .mode { margin-bottom: 12px; }
  select { padding: 6px 10px; border-radius: 6px; border: none; font-size: 1rem; }
</style>
</head>
<body>
  <h1>❌⭕ تيك تاك تو</h1>
  <div class="mode">
    <label for="mode">الوضع: </label>
    <select id="mode">
      <option value="pvp">لاعب ضد لاعب</option>
      <option value="ai">لاعب ضد الكمبيوتر</option>
    </select>
  </div>
  <div class="status" id="status">دور X</div>
  <div class="board" id="board"></div>
  <div class="score" id="score">X: 0  |  O: 0  |  تعادل: 0</div>
  <div class="controls">
    <button id="reset">إعادة الجولة</button>
    <button id="resetAll">إعادة النتائج</button>
  </div>

<script>
const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const scoreEl = document.getElementById('score');
const modeSel = document.getElementById('mode');
let board = Array(9).fill(null);
let current = 'X';
let gameOver = false;
let scores = { X:0, O:0, D:0 };

const wins = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

function render() {
  boardEl.innerHTML = '';
  board.forEach((v,i) => {
    const c = document.createElement('div');
    c.className = 'cell' + (v ? ' '+v.toLowerCase() : '');
    c.textContent = v || '';
    c.addEventListener('click', () => move(i));
    boardEl.appendChild(c);
  });
}

function checkWinner(b) {
  for (const [a,bb,cc] of wins) {
    if (b[a] && b[a]===b[bb] && b[a]===b[cc]) return {player:b[a], line:[a,bb,cc]};
  }
  if (b.every(x=>x)) return {player:'D', line:[]};
  return null;
}

function move(i) {
  if (gameOver || board[i]) return;
  board[i] = current;
  const res = checkWinner(board);
  if (res) {
    gameOver = true;
    if (res.player === 'D') { statusEl.textContent = 'تعادل!'; scores.D++; }
    else { statusEl.textContent = 'فز '+res.player+'!'; scores[res.player]++; highlight(res.line); }
    updateScore();
    return;
  }
  current = current === 'X' ? 'O' : 'X';
  statusEl.textContent = 'دور '+current;
  render();
  if (modeSel.value === 'ai' && current === 'O' && !gameOver) {
    setTimeout(aiMove, 350);
  }
}

function highlight(line) {
  render();
  line.forEach(i => {
    const cells = boardEl.querySelectorAll('.cell');
    cells[i].classList.add('win');
  });
}

function aiMove() {
  if (gameOver) return;
  // Minimax
  let best = -Infinity, idx = -1;
  for (let i=0;i<9;i++){
    if (!board[i]){
      board[i]='O';
      const s = minimax(board, 0, false);
      board[i]=null;
      if (s > best){ best=s; idx=i; }
    }
  }
  if (idx !== -1) move(idx);
}

function minimax(b, depth, isMax) {
  const r = checkWinner(b);
  if (r) {
    if (r.player === 'O') return 10 - depth;
    if (r.player === 'X') return depth - 10;
    return 0;
  }
  if (isMax) {
    let best = -Infinity;
    for (let i=0;i<9;i++) if(!b[i]){ b[i]='O'; best=Math.max(best,minimax(b,depth+1,false)); b[i]=null; }
    return best;
  } else {
    let best = Infinity;
    for (let i=0;i<9;i++) if(!b[i]){ b[i]='X'; best=Math.min(best,minimax(b,depth+1,true)); b[i]=null; }
    return best;
  }
}

function updateScore() {
  scoreEl.textContent = `X: ${scores.X}  |  O: ${scores.O}  |  تعادل: ${scores.D}`;
}

document.getElementById('reset').addEventListener('click', () => {
  board = Array(9).fill(null);
  current = 'X';
  gameOver = false;
  statusEl.textContent = 'دور X';
  render();
});

document.getElementById('resetAll').addEventListener('click', () => {
  scores = {X:0,O:0,D:0};
  updateScore();
  document.getElementById('reset').click();
});

render();
</script>
</body>
</html>
